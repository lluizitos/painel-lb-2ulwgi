<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#141218">
<title>Minhas tarefas · LB</title>
<link rel="icon" href="../../icone.png"><link rel="apple-touch-icon" href="../../icone.png">
<style>
:root{--bg:#141218;--card:#1E1C24;--card2:#26232D;--line:#2E2B36;--ink:#F3F1F6;--sub:#B8B3C3;--muted:#8B8697;--pink:#CF1D51;--pinkl:#F0507E;--neg:#FF8FA8;--pos:#7FDDA9;--blue:#8EC5FF}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:50px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:22px 0 6px;text-align:center}header img{height:30px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--pinkl);margin:18px 0 4px;text-align:center}
h1{font-size:32px;font-weight:900;text-transform:uppercase;margin:0;text-align:center;line-height:1.05}h1 em{font-style:normal;color:var(--pink)}
.fn{text-align:center;color:var(--sub);font-size:13.5px;margin-top:6px}
.meta{margin-top:16px;background:var(--card);border-radius:14px;padding:12px 16px;border-left:4px solid var(--pink)}
.meta span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.res div{background:var(--card);border-radius:12px;padding:10px;text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.res b{display:block;font-size:22px;letter-spacing:0;color:var(--ink)}
h3{font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--pinkl);margin:24px 2px 10px}
.list{display:flex;flex-direction:column;gap:8px}
.tf{background:var(--card);border-radius:14px;padding:14px;border-left:4px solid var(--line)}
.tf.and{border-left-color:var(--blue)}.tf.atr{border-left-color:var(--neg)}.tf.ok{border-left-color:var(--pos);opacity:.7}
.tf b{display:block;font-size:16px}.tf .ds{font-size:13.5px;color:var(--sub);margin-top:4px;white-space:pre-wrap}
.tf .pz{font-size:12.5px;color:var(--muted);margin-top:6px}.tf .pz .neg{color:var(--neg);font-weight:700}
.bts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bt{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600}
.bt.on{background:var(--blue);border-color:var(--blue);color:#141218}.bt.done{background:var(--pos);border-color:var(--pos);color:#141218}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:22px;background:var(--card);border-radius:14px}
.err{color:var(--neg);text-align:center;margin-top:40px}
.lg{max-width:340px;margin:36px auto 0;text-align:center}.lg p{color:var(--sub);font-size:14px;margin:0 0 14px}
.pw{position:relative}.pw input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 52px 14px 16px;color:var(--ink);font:inherit;font-size:16px;text-align:center}
.olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--sub);font-size:19px;padding:8px 10px;line-height:1}
.lg .ent{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--pink);color:#fff;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.lg .em{color:var(--neg);font-size:13px;min-height:20px;margin-top:10px}.sair{display:block;margin:30px auto 0;background:transparent;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline}
details summary{cursor:pointer;color:var(--sub);font-size:13px;margin:20px 2px 8px}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../logo.png" alt="Lucas Barros"></header>
<p class="eyebrow">Minhas tarefas</p>
<div id="app"><p class="fn">Carregando…</p></div>
<button type="button" class="sair" id="sair" hidden>Sair deste aparelho</button>
</div>
<script src="../../lbmetas.js?v=mws76g2p"></script>
<script src="../../lbchat.js?v=mws76g2p"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HOJE=new Date(Date.now()-3*3600e3).toISOString().slice(0,10),MES=HOJE.slice(0,7);
const ddmm=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
const K=new URLSearchParams(location.hash.slice(1)).get('k')||'';
/* o link só identifica a pessoa: sem a senha não abre nada. A senha fica guardada neste aparelho até tocar em "Sair". */
const SK='lb_tk_'+K.slice(0,24),lerS=()=>{try{return localStorage.getItem(SK)||''}catch(e){return''}},
  limpa=()=>{try{localStorage.removeItem(SK);Object.keys(localStorage).filter(x=>x.startsWith('lbrot_')||x.startsWith('lbq_Minhas')).forEach(x=>localStorage.removeItem(x))}catch(e){}};
let API='',P=null,T=[],KS=lerS(),CHAT=false;
const MSG={senha:'Senha incorreta.',sem_senha:'Seu acesso ainda não tem senha. Peça ao Luiz.',bloqueado:'Muitas tentativas. Espere 15 minutos e tente de novo.',link:'Este link não vale mais. Peça o novo ao Luiz.'};
async function api(c){const r=await (await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({k:K,ks:KS},c))})).json();
  if(!r.ok){if(MSG[r.erro]&&KS){limpa();KS='';login(MSG[r.erro])}throw new Error(r.erro||'erro')}if(r.perfil){P=r.perfil;T=r.tarefas}return r}
function login(m){const app=document.getElementById('app');
  app.innerHTML=`<form class="lg" autocomplete="on"><p>Digite sua senha para abrir suas tarefas.</p>    <div class="pw"><input type="password" id="ks" placeholder="Senha" autocomplete="current-password" aria-label="Senha"><button type="button" class="olho" aria-label="Mostrar senha" title="Mostrar senha"></button></div>
    <button type="submit" class="ent">Entrar</button><div class="em">${esc(m||'')}</div></form>`;
  const f=app.querySelector('form'),i=f.querySelector('#ks'),o=f.querySelector('.olho');i.focus();
  const IC_OLHO='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',IC_RISC='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.5M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>';o.innerHTML=IC_OLHO;
  o.onclick=()=>{const v=i.type==='password';i.type=v?'text':'password';o.innerHTML=v?IC_RISC:IC_OLHO;o.setAttribute('aria-label',v?'Esconder senha':'Mostrar senha');i.focus()};
  f.onsubmit=async e=>{e.preventDefault();const v=i.value.trim();if(!v)return;f.querySelector('.em').textContent='Abrindo…';KS=v;limpa();
    try{await abre();try{localStorage.setItem(SK,v)}catch(e2){}}catch(er){KS='';f.querySelector('.em').textContent=MSG[er.message]||'Não consegui abrir agora. Tente de novo.'}}}
async function abre(){const app=document.getElementById('app');
  app.innerHTML='<p class="fn">Carregando…</p>';await LBROT.pagina(app,api,'tarefas LB');
  const b=document.getElementById('sair');b.hidden=false;b.onclick=()=>{limpa();location.reload()};
  if(!CHAT&&window.LBCHAT){CHAT=true;LBCHAT.auto(app,{base:'../../',pagina:'Minhas tarefas',exemplo:'o que está atrasado?',auth:()=>({k:K,ks:KS})})}}
(async()=>{const app=document.getElementById('app');
  if(!K){app.innerHTML='<p class="err">Link incompleto. Peça o seu link ao Luiz.</p>';return}
  try{API=(await (await fetch('../../config.json',{cache:'no-store'})).json()).api_url}catch(e){app.innerHTML='<p class="err">Não consegui abrir agora. Tente de novo em instantes.</p>';return}
  if(!KS)return login('');
  try{await abre()}catch(e){if(!MSG[e.message])app.innerHTML='<p class="err">Não consegui abrir agora. Tente de novo em instantes.</p>'}})();
</script>
</body>
</html>
