<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141218">
<title>Artista · Lucas Barros</title>
<link rel="icon" href="../icone.png"><link rel="apple-touch-icon" href="../icone.png">
<!-- Página do Lucas (tema das outras páginas). Abas: Agenda (calendário mês/semana/dia com shows, pagamentos e tarefas + minhas tarefas),
     Pagamentos (igual ao Financeiro: somados por pessoa, PIX à mostra, pago/adiar) e Equipe (um quadro por pessoa, com gráficos). Chat no topo, com comprovante. -->
<style>
:root{--bg:#141218;--card:#1E1C24;--card2:#26232D;--line:#2E2B36;--ink:#F3F1F6;--sub:#B8B3C3;--muted:#8B8697;--pink:#CF1D51;--pinkl:#F0507E;--neg:#FF8FA8;--pos:#7FDDA9;--sai:#6F697D;--amber:#F2B66B;--blue:#7AB8FF;--lil:#B9A4FF}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;padding-bottom:60px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(20,18,24,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
header img{height:24px;display:block;flex:none}
.links{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;align-items:center}.links::-webkit-scrollbar{display:none}
.links a{flex:none;text-decoration:none;color:var(--sub);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--line);border-radius:99px}
.links a.on{background:var(--card2);color:var(--ink);border-color:var(--sub)}
@media(max-width:480px){header img{height:19px}}
.ptabs{display:flex;gap:4px;max-width:900px;margin:0 auto;padding:0 16px 8px}
.ptabs button{flex:1;background:none;border:0;border-bottom:2px solid var(--line);padding:9px 2px;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer;font-family:inherit}
.ptabs button.on{color:var(--ink);border-color:var(--pink)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--pinkl);margin:26px 0 6px}
h1{font-size:30px;font-weight:900;text-transform:uppercase;margin:0 0 14px;line-height:1.05}h1 em{font-style:normal;color:var(--pink)}
h2.tt{font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--pinkl);margin:26px 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2.tt small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.note{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.ic{width:16px;height:16px;flex:none;vertical-align:-3px;margin-right:6px}
/* avisos urgentes */
#urg{display:grid;gap:8px;margin:14px 0 4px}#urg:empty{display:none}.urgh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;color:var(--ink)}.urgh button{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font:inherit;font-size:13.5px;color:var(--sub);cursor:pointer;flex:none}
.urg{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:rgba(255,143,168,.1);border:1px solid rgba(255,143,168,.5);border-radius:14px;padding:12px 14px;cursor:pointer;animation:pisca 1.4s ease-in-out infinite}
.urg span{font-size:14.5px;font-weight:600}.urg small{display:block;font-size:12.5px;font-weight:400;color:var(--neg);margin-top:2px}.urg .ic{width:20px;height:20px;margin:0;color:var(--neg)}
@keyframes pisca{0%,100%{border-color:rgba(255,143,168,.5)}50%{border-color:var(--neg);background:rgba(255,143,168,.2)}}
@media (prefers-reduced-motion:reduce){.urg{animation:none}}
/* 22/11: avisos em carrossel (arrasta para o lado) + shows da semana e shows feitos sem pagamento */
.urgc{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;scroll-padding:0 16px}.urgc::-webkit-scrollbar{display:none}
.urgc .urg{flex:0 0 86%;max-width:420px;scroll-snap-align:start;align-self:stretch}.urgc .urg:only-child{flex-basis:100%;max-width:none}
.urg.ush{background:rgba(122,184,255,.1);border-color:rgba(122,184,255,.5);animation:none}.urg.ush small{color:var(--blue)}.urg.ush .ic{color:var(--blue)}
.urg.upd{background:rgba(242,182,107,.1);border-color:rgba(242,182,107,.55);animation:none}.urg.upd small{color:var(--amber)}.urg.upd .ic{color:var(--amber)}
.qsh{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 18px}@media(max-width:380px){.qsh{gap:7px}}
.qb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px;min-width:0}.qb.qsem{border-color:rgba(122,184,255,.45)}.qb.qpen{border-color:rgba(242,182,107,.5)}
.qh{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin:0 2px 8px}.qh .ic{width:14px;height:14px;flex:none}.qsem .qh .ic{color:var(--blue)}.qpen .qh .ic{color:var(--amber)}
.qh i{font-style:normal;margin-left:auto;background:var(--card2);border-radius:99px;padding:1px 7px;color:var(--ink);letter-spacing:0}
.ql{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card2);border:0;border-radius:10px;padding:8px;margin:0 0 6px;cursor:pointer}
.ql>b{flex:none;font-size:12px;font-weight:800;padding-top:1px}.qsem .ql>b{color:var(--blue)}.qpen .ql>b{color:var(--amber)}
.ql span{flex:1;min-width:0;font-size:12.5px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}.ql small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}
.qv{font-size:12.5px;color:var(--muted);padding:4px 2px 8px;line-height:1.4}.qv b{color:var(--ink)}
.vds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.vdw{position:relative;display:flex}.vdw>.vdc{flex:1}
.vdb{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}.vdb svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.vdc{display:flex;flex-direction:column;padding:0;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}.vdc[disabled]{cursor:default}
.vdp{position:relative;aspect-ratio:9/16;background:#0b0a0e;display:flex;align-items:center;justify-content:center;width:100%}.vdp video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vpl{position:relative;width:52px;height:52px;border-radius:50%;background:var(--pink);color:#fff;font-style:normal;font-size:20px;display:flex;align-items:center;justify-content:center;padding-left:4px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.vsb{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(242,182,107,.5);border-radius:99px;padding:5px 10px}
.vdt{padding:8px 10px 10px;display:flex;flex-direction:column;gap:1px}.vdt b{font-size:13.5px;line-height:1.25}.vdt small{font-size:11.5px;color:var(--muted)}
.rls{position:fixed;inset:0;z-index:9999;background:#000}.rlx{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}.rlx::-webkit-scrollbar{display:none}
.rl{position:relative;height:100%;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;background:#000}.rl video,.rl iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.rlb{position:absolute;left:0;right:0;bottom:0;padding:90px 80px calc(22px + env(safe-area-inset-bottom)) 16px;background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;flex-direction:column;gap:4px;pointer-events:none;color:#fff}
.rlc{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer}
.rlp{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:28px;align-items:center;justify-content:center;padding-left:5px;pointer-events:none}.rl.pz .rlp{display:flex}
.rlu{display:flex;align-items:center;gap:8px}.rlu i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F0507E,#CF1D51);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;font-size:11px}.rlu b{font-size:14.5px}
.rlb p{margin:2px 0 0;font-size:14px;line-height:1.35}.rlb small{font-size:12px;color:#ddd}
.rla{position:absolute;right:8px;bottom:calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:16px;z-index:2}
.rla>*{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:#fff;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.rla svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.rla .on svg{fill:#ff3040;stroke:#ff3040;animation:rpop .3s}.rla .ok svg{stroke:#7FDDA9}@keyframes rpop{50%{transform:scale(1.25)}}
.rlk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);pointer-events:none;opacity:0}.rlk svg{width:110px;height:110px;fill:#fff;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}.rlk.an{animation:rheart .8s ease-out}@keyframes rheart{15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(.95)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.rlv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ddd;font-weight:700;text-align:center;gap:6px}.rlv small{font-weight:400;color:#999}
.rlt{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;z-index:2;color:#fff;display:flex;align-items:baseline;gap:8px;pointer-events:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}.rlt b{font-size:20px}.rlt span{font-size:13px;opacity:.85}
.rcm{position:absolute;left:0;right:0;bottom:0;z-index:5;height:62%;background:#1E1C24;border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;color:#F3F1F6}.rls.cm .rcm{transform:none}
.rcmh{display:flex;justify-content:center;align-items:center;position:relative;padding:14px;border-bottom:1px solid #2E2B36}.rcmh button{position:absolute;right:10px;background:none;border:0;color:#F3F1F6;font-size:18px;cursor:pointer}
.rcml{flex:1;overflow:auto;padding:10px 14px}.rcc{display:flex;gap:10px;padding:8px 0;font-size:14px;line-height:1.35}.rcc>i{flex:none;width:30px;height:30px;border-radius:50%;background:#26232D;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:12px}.rcc small{display:block;color:#8B8697;font-size:11.5px;margin-top:2px}.rcc a{color:#8B8697}
.rcv{text-align:center;color:#8B8697;padding:40px 10px;font-size:14px;line-height:1.5}
.rcmf{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #2E2B36}.rcmf input{flex:1;min-width:0;background:#26232D;border:1px solid #2E2B36;border-radius:99px;padding:10px 14px;color:#F3F1F6;font:inherit;font-size:14px}.rcmf button{background:none;border:0;color:#F0507E;font:inherit;font-weight:800;cursor:pointer}
.rlh{position:absolute;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#fff;font-size:12.5px;font-weight:700;background:rgba(0,0,0,.45);border-radius:99px;padding:6px 12px;pointer-events:none;animation:rlh 1.6s ease-in-out infinite}@keyframes rlh{50%{transform:translate(-50%,-6px)}}
.urgd{display:flex;justify-content:center;gap:5px;margin-top:2px}.urgd i{width:6px;height:6px;border-radius:9px;background:var(--line)}.urgd i.on{background:var(--pinkl);width:16px}
.urgd{align-items:center}.urgd i{cursor:pointer;padding:0;transition:width .2s}.urgd .avs-a{display:none;background:none;border:1px solid var(--line);color:var(--ink);width:28px;height:28px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;margin:0 8px}
@media (hover:hover) and (pointer:fine){.urgd .avs-a{display:inline-flex;align-items:center;justify-content:center}.urgd i{width:8px;height:8px}.urgd i.on{width:18px}.avx{cursor:grab}}
/* comuns */
.list{display:flex;flex-direction:column;gap:8px}
.c{background:var(--card);border-radius:12px;padding:12px 14px;border-left:4px solid var(--line)}
.c .n{font-weight:600;font-size:14.5px}.c .d{font-size:12.5px;color:var(--sub);margin-top:2px}
.c.ok{border-left-color:var(--pos)}.c.ok .n{color:var(--pos)}.c.ruim{border-left-color:var(--neg)}.c.ruim .n{color:var(--neg)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--sub);white-space:nowrap;margin:6px 6px 0 0}
.tag.ok{background:rgba(127,221,169,.14);color:var(--pos)}.tag.ruim{background:rgba(255,143,168,.14);color:var(--neg)}.tag.am{background:rgba(242,182,107,.14);color:var(--amber)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--pink);border-radius:99px}.c.ok .bar i{background:var(--pos)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.btn.fiz{background:var(--pink);border-color:var(--pink);color:#fff}.btn:disabled{opacity:.5}
.vazio,.empty{font-size:13px;color:var(--muted);background:var(--card);border-radius:12px;padding:12px 14px}
.mais{display:block;width:100%;margin-top:8px;border:1px dashed var(--line);background:none;color:var(--sub);border-radius:12px;padding:9px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font:inherit;font-size:12.5px;color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--card2);color:var(--ink);border-color:var(--sub)}.chip.off{opacity:.5;text-decoration:line-through}
.chip em{display:inline-block;width:8px;height:8px;border-radius:3px}
/* agenda (calendário) */
.cbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.cbar .tit{flex:1;font-weight:700;font-size:15px;text-transform:capitalize}
.nv{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:99px;width:34px;height:34px;font-size:16px;cursor:pointer;font-family:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;cursor:pointer}.seg button.on{background:var(--card2);color:var(--ink)}
.cal{background:var(--card);border-radius:14px;padding:10px}
.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cw span{text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;padding-bottom:4px}
.cd{min-height:74px;min-width:0;border:0;border-top:1px solid var(--line);border-radius:6px;background:none;color:var(--sub);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;cursor:pointer;padding:4px 2px 3px;font:inherit;overflow:hidden}.cd>b{align-self:center;margin-bottom:1px;font-size:13px;font-weight:600}
.cd.hj>b{color:#fff;background:var(--pink);border-radius:99px;padding:1px 6px}.cd.fora{opacity:.35}
.ce{display:block;font-style:normal;font-size:9.5px;line-height:1.3;font-weight:700;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;color:#141218}.ce.fe{opacity:.45;text-decoration:line-through}.cm{display:block;font-style:normal;font-size:9.5px;color:var(--muted);text-align:left;padding-left:4px}
@media(min-width:700px){.cd{min-height:96px;padding:5px 4px}.ce,.cm{font-size:11px;padding:2px 6px}}
.pt-s{background:var(--blue)}.pt-c{background:var(--amber)}.pt-ok{background:var(--amber)}.pt-a{background:var(--neg)}.pt-t{background:var(--pos)}.pt-e{background:var(--lil)}
.clg{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;margin-top:8px;font-size:11px;color:var(--muted)}.clg em{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px;vertical-align:middle}
.dia{margin-top:6px}.dia>.dh{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px;cursor:pointer;background:none;border:0;width:100%;padding:0;font-family:inherit}.dia>.dh.hj{color:var(--pinkl)}
.ev{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:0;border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.ev>em{flex:none;width:4px;align-self:stretch;border-radius:4px}.ev .t{flex:1;min-width:0}.ev .t b{display:block;font-size:14px;font-weight:600}.ev .t span{font-size:12px;color:var(--muted)}.ev .v{flex:none;font-weight:700;white-space:nowrap;font-size:13.5px}
.ev.fe .t b{text-decoration:line-through;color:var(--muted)}
/* popup */
#bd{position:fixed;inset:0;z-index:45;background:rgba(10,9,12,.72);display:none;align-items:center;justify-content:center;padding:12px}
#bd.open{display:flex}
#bd .sh{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:18px 16px 24px}
#bd .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
#bd h3{font-size:20px;font-weight:900;text-transform:uppercase;margin:2px 0 2px;line-height:1.1}
#bd .x,#bd .vl{flex:none;border:1px solid var(--line);background:var(--card2);border-radius:99px;width:36px;height:36px;font-size:18px;color:var(--ink);cursor:pointer}
#bd .vl{width:auto;height:auto;padding:6px 12px;font:inherit;font-size:12.5px;margin-bottom:10px}
#bd h4{margin:14px 0 6px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--pinkl);display:flex;justify-content:space-between}#bd h4 span{color:var(--muted);letter-spacing:.04em}
.bt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.bt div{background:var(--card);border-radius:12px;padding:10px 12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.bt div b{display:block;font-size:15px;letter-spacing:0;color:var(--ink);margin-top:2px;white-space:nowrap}
.pe{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.pe .t{flex:1;min-width:0}.pe .t b{display:block;font-size:14px;overflow-wrap:anywhere}.pe .t span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pe .v{flex:none;text-align:right;font-weight:700;white-space:nowrap}.pe .v small{display:block;font-weight:400;font-size:11px;color:var(--muted)}

<script>
const SV=d=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const IC={al:SV('<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>'),ok:SV('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>'R$ '+Math.round(+v||0).toLocaleString('pt-BR');
const brl2=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const HOJE=new Date(Date.now()-3*3600e3).toISOString().slice(0,10),MA=HOJE.slice(0,7);
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'],DS=['dom','seg','ter','qua','qui','sex','sáb'],DSL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const ddmm=d=>/^\d{4}-\d{2}-\d{2}/.test(d||'')?d.slice(8,10)+'/'+d.slice(5,7):(d||'');
const dias=d=>Math.round((new Date(String(d).slice(0,10)+'T12:00')-new Date(HOJE+'T12:00'))/864e5);
const isoD=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return isoD(x)};
const ISO=/^\d{4}-\d{2}-\d{2}$/,FEITO=/conclu|feit|batid|pago|resolvid|cumprid/i;
const fimMes=(()=>{const d=new Date(+MA.slice(0,4),+MA.slice(5,7),0);return MA+'-'+String(d.getDate()).padStart(2,'0')})();
const jso=t=>{try{return JSON.parse(t||'{}')||{}}catch(e){return {}}};
const limpaPix=x=>String(x||'').replace(/\s*\((nubank|picpay|inter|banco c6)\)\s*$/i,'').replace(/\s+(Inter|Banco c6)$/i,'').trim();
const ST={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let D=null,API='',TAR=null,MIN=null,PAGS=[],PAGS_OK=false,PESS=[],PCFG={},SHV=null; // 24/11: PCFG = o que o Admin escolheu para esta página; SHV = shows ao vivo (Vendas)
async function api(c){const r=await (await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({usuario:LB.login,senha:LB.senha,nome:LB.usuario},c))})).json();if(!r.ok)throw new Error(r.erro||'erro');return r}
function copiar(t,btn){const ok=()=>{if(btn){const o=btn.textContent;btn.textContent='copiado';btn.classList.add('ok');setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok')},1500)}};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>{fb();ok()});else{fb();ok()}}
document.addEventListener('click',e=>{const c=e.target.closest('[data-cp]');if(c){e.stopPropagation();copiar(c.dataset.cp,c)}},true);

/* "ver mais": listas longas mostram só o começo */
const ABERTO=new Set();
function vm(id,itens,n){if(itens.length<=n||ABERTO.has(id))return itens.join('')+(itens.length>n?`<button class="mais" data-vm="${id}">Ver menos</button>`:'');
  return itens.slice(0,n).join('')+`<button class="mais" data-vm="${id}">Ver mais (${itens.length-n})</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-vm]');if(!b)return;const k=b.dataset.vm;ABERTO.has(k)?ABERTO.delete(k):ABERTO.add(k);renderTudo()});

/* ---------- avisos urgentes no topo ---------- */
const orcPrin=()=>((TAR&&TAR.metas)||[]).filter(m=>m.tipo==='despesa'&&m.painel==='sim'&&!/Pago|Resolvido/.test(m.situacao||'')); // 18/11: aviso principal (orçamento)
let URGANT=[];
function urgentes(){const U=[];try{LB.orc.mostra(document.getElementById('orcbox'),orcPrin())}catch(e){console.error(e)}
  /* 24/11: destaque = 1º o que o Luiz escolheu no Admin (Notificações → Página do Lucas); depois avisos, movimentações de hoje, show vendido hoje e tarefas marcadas "Exibir pro Artista" */
  const DST=PCFG&&PCFG.destaque,MT=(TAR&&TAR.metas)||[];
  if(DST&&DST.tipo&&!(DST.ate&&DST.ate<HOJE)){const[t1,t2]=String(DST.id||'').split('|');
    if(DST.tipo==='aviso')U.push({t:DST.texto||DST.titulo||'Aviso',s:'',d:'',fixo:1,c:'dst'});
    else if(DST.tipo==='video'){const n=(VIDS||[]).filter(v=>v.visivel!=='não'&&(v.show||'Vídeos')===DST.id).length;U.push({t:'Vídeos do '+String(DST.id).replace(/^Show /i,'show '),s:n?n+(n>1?' vídeos':' vídeo')+' · toque para assistir':'toque para ver',d:'',k:'vid|'+DST.id,ic:LB.ic('show'),fixo:1,c:'dst vidav'})}
    else if(DST.tipo==='pagamento'){const g=PAGS.find(x=>x.id===t1);let o=null;try{o=g&&LB.pgx.ocorr(g,'9999-12-31').find(y=>y.ref===t2)}catch(e){}
      if(g&&o&&!o.pago&&o.falta>0.004)U.push({t:'Pagar: '+(g.descricao||g.nome),s:brl(o.falta)+' · '+(o.data<HOJE?'venceu ':'vence ')+ddmm(o.data),d:'',k:'g|'+g.id+'|'+o.ref,ic:LB.ic('pag'),fixo:1,c:'dst'})}
    else{const m=MT.find(x=>String(x.id)===String(DST.id));if(m&&!FEITO.test(m.situacao||''))U.push({t:m.titulo,s:m.tipo==='evento'?[ddmm(m.termino||m.prazo),m.hora,m.local].filter(Boolean).join(' · '):[m.alvo,m.valor?brl(+m.valor):''].filter(Boolean).join(' · '),d:'',k:'m|'+m.id,fixo:1,c:'dst'})}}
  MT.forEach(m=>{if(FEITO.test(m.situacao||'')||/cancel/i.test(m.situacao||''))return;if(DST&&String(DST.id)===String(m.id))return;if(m.tipo==='despesa'&&m.painel==='sim')return;
    if(m.painel==='sim')U.push({t:m.titulo,s:[m.alvo,m.prazo?'prazo '+(ISO.test(m.prazo)?ddmm(m.prazo):m.prazo):''].filter(Boolean).join(' · '),d:ISO.test(m.prazo)?m.prazo:'',fixo:1,k:'m|'+m.id});
    else if(m.artista==='sim')U.push({t:(m.tipo==='evento'?'':m.tipo==='tarefa'?'Tarefa: ':'')+m.titulo,s:m.tipo==='evento'?[ddmm(m.termino||m.prazo),m.hora,m.local].filter(Boolean).join(' · '):[m.alvo,ISO.test(m.prazo||'')?'prazo '+ddmm(m.prazo):''].filter(Boolean).join(' · '),d:'',k:'m|'+m.id,ic:LB.ic(m.tipo==='evento'?'emp':'tar')})});
  /* movimentações de hoje na conta (máx. definido no Admin) */
  {const lim=PCFG&&PCFG.mov_lim!=null?+PCFG.mov_lim:3;let mv=[];try{mv=ultMovs().filter(m=>m.data===HOJE)}catch(e){}
   mv.slice(0,lim).forEach(m=>U.push({t:(+m.valor>=0?'Entrou ':'Saiu ')+brl(Math.abs(+m.valor||0)),s:[m.quem,m.cat].filter(Boolean).join(' · ')+' · hoje',d:'',c:+m.valor>=0?'mvp':'mvn',ic:LB.ic('pag')}));
   if(mv.length>lim&&lim>0)U.push({t:'+'+(mv.length-lim)+' movimentações hoje',s:'veja no Financeiro',d:'',k:'fin',ic:LB.ic('pag')})}
  /* show vendido hoje (Vendas ao vivo) */
  (SHV||[]).filter(x=>String(x.data_venda||'').slice(0,10)===HOJE&&!/cancel/i.test(x.status||'')).forEach(x=>U.push({t:'Show vendido hoje 🎉',s:[ISO.test(x.data||'')?ddmm(x.data):'',x.cidade,x.evento].filter(Boolean).join(' · '),d:'',fixo:1,ic:LB.ic('show'),c:'mvp'}));
  /* vídeos: só viram aviso se o widget de vídeo estiver oculto no Admin */
  if(PCFG&&PCFG.video_widget==='não'){const G={};(VIDS||[]).filter(v=>v.visivel!=='não'&&v.avisar!=='não').forEach(v=>{const k=v.show||'Vídeos';(G[k]=G[k]||[]).push(v)});
   Object.entries(G).forEach(([k,l])=>{if(DST&&DST.tipo==='video'&&DST.id===k)return;U.push({t:'Vídeos do '+k.replace(/^Show /i,'show ')+' · '+l.length+(l.length>1?' novos':' novo'),s:l.some(v=>v.previa)?'toque para assistir':'em mixagem · toque para ver a lista',d:'',k:'vid|'+k,ic:LB.ic('show'),fixo:1,c:'vidav'})})}
  /* shows da semana ficam no quadro acima da agenda; shows feitos pendentes saíram (24/11) */
  const SW=[],dsem=['dom','seg','ter','qua','qui','sex','sáb'];
  (D.shows||[]).forEach((s,i)=>{if(/cancel/i.test(s.sit||''))return;const n=dias(s.data);if(n>=0&&n<=7){const conf=/confirmado|realizado/i.test(s.sit||'');SW.push({t:'Show '+dsem[new Date(s.data+'T12:00').getDay()]+' '+ddmm(s.data)+' · '+s.nome,s:[s.local,n===0?'é hoje':n===1?'é amanhã':'faltam '+n+' dias',conf?'':'a confirmar'].filter(Boolean).join(' · '),d:s.data,k:'s|'+i,c:'ush',ic:LB.ic('show')})}});
  SW.sort((a,b)=>a.d<b.d?-1:1);URGANT=[];
  try{quadros(SW,[],[])}catch(e){console.error(e)}
  const UF=U.filter(u=>u.fixo),UL=UF.concat(U.filter(u=>!u.fixo)),min=ST.get('lb_urg_min2')==='1';
  const el=document.getElementById('urg'),DS=['dom','seg','ter','qua','qui','sex','sáb'];
  el.innerHTML=UL.map(u=>`<button type="button" class="urg avs${u.c?' '+u.c:''}" data-urd="${esc(u.d||'')}"${u.k?` data-urk="${esc(u.k)}"`:''}><span class="al">${u.ic||IC.al} Aviso${u.d?' · '+DS[new Date(u.d+'T12:00').getDay()]+' '+ddmm(u.d):''}</span><b>${esc(u.t)}</b>${u.s?`<small>${esc(u.s)}</small>`:''}</button>`).join('');
  const ax=document.getElementById('avx'),dt=document.getElementById('avd'),sl=[...ax.children].flatMap(x=>x.id==='urg'?[...x.children]:x.children.length?[x]:[]).sort((a,b)=>(b.classList.contains('dst')?1:0)-(a.classList.contains('dst')?1:0));
  ax.classList.toggle('um',sl.length<=1);dt.innerHTML=sl.length>1?sl.map((u,i)=>`<i${i?'':' class="on"'}></i>`).join(''):'';
  ax.onscroll=()=>{const w=(sl[0]||{}).offsetWidth||1,i=Math.round(ax.scrollLeft/(w+10));const D=dt.querySelectorAll('i'),fim=ax.scrollLeft>=ax.scrollWidth-ax.clientWidth-4;D.forEach((x,j)=>x.classList.toggle('on',j===(fim?D.length-1:Math.min(i,D.length-1))))}
  /* 23/11: no computador: bolinhas e setas ‹ › clicáveis, e arrastar com o mouse */
  const W=()=>((sl[0]||{}).offsetWidth||300)+10,anda=x=>{x=Math.max(0,Math.min(x,ax.scrollWidth-ax.clientWidth));const a=ax.scrollLeft,t0=performance.now();ax.style.scrollSnapType='none';const f=()=>{const k=Math.min(1,(performance.now()-t0)/320),e=1-Math.pow(1-k,3);ax.scrollLeft=a+(x-a)*e;if(k<1)setTimeout(f,16);else ax.style.scrollSnapType=''};f()},vai=d=>anda((Math.round(ax.scrollLeft/W())+d)*W());
  dt.querySelectorAll('i').forEach((x,j)=>x.onclick=()=>anda(j*W()));
  dt.querySelectorAll('.avs-a').forEach(x=>x.remove());
  if(sl.length>1){const p=document.createElement('button'),n=document.createElement('button');p.type=n.type='button';p.className=n.className='avs-a';p.textContent='‹';n.textContent='›';p.setAttribute('aria-label','Aviso anterior');n.setAttribute('aria-label','Próximo aviso');p.onclick=()=>vai(-1);n.onclick=()=>vai(1);dt.prepend(p);dt.append(n)}
  if(!ax.dataset.arr){ax.dataset.arr=1;let x0=null,s0=0,mv=false;
    ax.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button)return;x0=e.clientX;s0=ax.scrollLeft;mv=false});
    addEventListener('pointermove',e=>{if(x0===null)return;const d=e.clientX-x0;if(Math.abs(d)>5){mv=true;ax.style.scrollSnapType='none';ax.style.cursor='grabbing'}if(mv)ax.scrollLeft=s0-d});
    addEventListener('pointerup',()=>{if(x0===null)return;x0=null;ax.style.cursor='';if(mv)anda(Math.round(ax.scrollLeft/W())*W())});
    ax.addEventListener('click',e=>{if(mv){e.stopPropagation();e.preventDefault();mv=false}},true)}}
/* 22/11: Financeiro → "Pagamentos próximos" (30 dias): contas/fixos e equipe dos próximos shows; tocar detalha */
function renderProx(){const el=document.getElementById('fprox');if(!el||!D)return;const ate=new Date(Date.now()+30*864e5).toISOString().slice(0,10),L=[];
  if(PAGS_OK)PAGS.filter(g=>g.ativo!=='não'&&g.direcao!=='entrada'&&g.ocultar!=='sim').forEach(g=>LB.pgx.ocorr(g,ate).filter(o=>!o.pago&&o.falta>0.004&&o.data>=HOJE&&!pAdiado(g,o.ref)).forEach(o=>L.push({d:o.data,t:g.descricao||g.nome,s:g.nome&&g.nome!==g.descricao?g.nome:(g.tipo==='fixo'?'fixo':'conta'),v:o.falta,k:'g|'+g.id+'|'+o.ref})));
  (D.shows||[]).forEach((s,i)=>{if(/cancel/i.test(s.sit||'')||s.data<HOJE||s.data>ate)return;const b=bordDe(s);if(!b||!b.equipe)return;let f=0;try{LB.pg.porData(b).forEach(q=>{f+=q.falta||0})}catch(e){}
    if(f>=1)L.push({d:s.data,t:'Equipe do show · '+s.nome,s:'borderô',v:f,k:'s|'+i})});

  if(t==='t'){const x=((MIN&&MIN.tarefas)||[]).find(y=>String(y.id)===a);if(x)abre(vol+topo('Tarefa',x.titulo,x.prazo?'prazo '+ddmm(x.prazo):'')+`<div class="cxb">${x.descricao?`<div class="cxl"><b style="font-weight:400">${esc(x.descricao)}</b></div>`:''}<div class="cxl"><span>Situação</span><b>${esc(x.status||'A fazer')}</b></div></div>${x.status!=='Concluída'?`<button class="btn fiz" style="margin-top:12px" data-fiz="${esc(x.id)}">Marcar como feita</button>`:''}`);return}

const pixBox=(pix)=>pix?`<div class="cxpix"><span>Chave PIX</span><b>${esc(limpaPix(pix))}</b><button class="cp" data-cp="${esc(limpaPix(pix))}">copiar PIX</button></div>`:`<div class="cxpix"><span>Chave PIX</span><b style="font-size:14px;color:var(--muted)">sem PIX no cadastro</b></div>`;
function pagHtml(g,ref){const o=(LB.pgx.ocorr(g,'2099-12-31').find(x=>x.ref===ref))||{};const pe=(g.pessoa&&PESS.find(p=>p.id===g.pessoa))||null,pix=g.pix||(pe&&pe.pix)||'',pago=!!o.pago||o.falta<=0.004;

  return topo('Pagamento · '+(pago?'pago':o.data<HOJE?'vencido '+ddmm(o.data):'vence '+ddmm(o.data)),g.descricao||g.nome,g.nome!==g.descricao?g.nome:'')+`<div class="cxb">${pixBox(pix)}${ln('Valor',brl2(pago?+g.valor:o.falta),(pago?+g.valor:o.falta).toFixed(2).replace('.',','))}${o.pg&&!pago?ln('Já pago',brl2(o.pg)):''}${ln('Vencimento',ddmm(o.data)+'/'+String(o.data).slice(0,4))}${g.meio?ln('Meio',g.meio):''}${g.dados?ln('Dados',g.dados,g.dados):''}</div>`}
/* borderô do show: cachê, custo, equipe por grupo; tocar no nome mostra o PIX */
function bordHtml(s){const b=bordDe(s),dt=new Date(s.data+'T12:00'),t=(b&&b.totais)||{},valor=s.valor||(b&&b.valor)||0,gasto=t.gasto!=null?t.gasto:s.gasto,sobra=valor&&gasto!=null?valor-gasto:null;
  let h=topo('Show · '+DS[dt.getDay()]+' '+ddmm(s.data),s.nome,s.local||'')+`<div class="bt"><div>Cachê<b>${valor?brl(valor):'a definir'}</b></div><div>Custo<b>${gasto!=null?brl(gasto):'—'}</b></div><div>Sobra<b style="color:${sobra==null?'inherit':sobra>=0?'var(--pos)':'var(--neg)'}">${sobra!=null?brl(sobra):'—'}</b></div></div>`;
  if(!b||!b.equipe)return h+'<div class="vazio" style="margin-top:12px">O borderô deste show ainda não foi montado.</div>';
  const G={};b.equipe.forEach(e=>{(G[e.grupo||'Equipe']=G[e.grupo||'Equipe']||[]).push(e)});
  Object.entries(G).forEach(([g,l])=>{h+=`<h4>${esc(g)} <span>${brl(l.reduce((a,e)=>a+(e.fora?0:+e.total||0),0))}</span></h4>`+l.map(e=>{const f=LB.pg.falta(e);
    if(!e.pessoa&&(e.a_definir||e.nome==='A definir'))return `<div class="pe"><div class="t"><b style="color:var(--amber)">A definir</b><span>${esc(e.funcao||'')} · quem vai fazer ainda não foi escolhido</span></div><div class="v">${brl(e.total||e.valor||0)}</div></div>`;
    return `<div class="pe" data-px="1"><div class="t"><b>${esc(e.nome)}</b><span>${esc(e.funcao||'')} · toque para ver o PIX</span><div class="px">${e.pix?`PIX <b>${esc(limpaPix(e.pix))}</b> <button class="cp" data-cp="${esc(limpaPix(e.pix))}">copiar</button>`:'sem PIX no cadastro'}</div></div><div class="v">${brl(e.fora?e.valor:e.total)}<small><span class="pill ${e.status==='Pago'||f<=0.004?'ok':s.data<=HOJE?'ruim':'am'}">${esc((e.status||'pendente').toLowerCase())}</span></small></div></div>`}).join('')});
  const it=(b.itens||[]).filter(x=>+x.valor);if(it.length)h+=`<h4>Itens <span>${brl(t.itens)}</span></h4>`+it.map(x=>`<div class="pe"><div class="t"><b>${esc(x.desc||'item')}</b>${+x.qtd>1||x.pag_em||x.status==='Pago'?`<span>${[+x.qtd>1?x.qtd+' ×':'',x.status==='Pago'?'pago':x.pag_em?'pagar em '+ddmm(x.pag_em):''].filter(Boolean).join(' · ')}</span>`:''}</div><div class="v">${brl((+x.valor||0)*(+x.qtd||1))}</div></div>`).join('');
  if(t.diesel)h+=`<h4>Viagem</h4><div class="pe"><div class="t"><b>Diesel</b></div><div class="v">${brl(t.diesel)}</div></div>`;
  return h}

const pgLimpa=x=>String(x||'').replace(/\s*\((nubank|picpay|inter|banco c6)\)\s*$/i,'').replace(/\s+(Inter|Banco c6)$/i,'').trim();

const pgVenc=d=>d>HOJE?'vence '+ddmm(d):d===HOJE?'vence hoje':'vencido';

const MEIO_TXT={conta:'conta / PIX',dinheiro:'dinheiro'};
function pedeMeio(btn,padrao,run){if(btn.dataset.ok==='1')return;btn.dataset.ok='1';const o=btn.innerHTML;btn._run=run;

  setTimeout(()=>{if(btn.isConnected&&!btn.disabled){btn.dataset.ok='';btn.innerHTML=o;btn.classList.remove('cf')}},8000)}
async function marcarPago(marcas,btn,gms=[],meio){

  requestAnimationFrame(()=>go(false));if(!el._ro&&window.ResizeObserver){let w0=0;el._ro=new ResizeObserver(()=>{const w=el.clientWidth;if(w&&!w0)go(false);w0=w});el._ro.observe(el)}
  document.getElementById('tlp').onclick=()=>el.scrollBy({left:-274,behavior:'smooth'});document.getElementById('tln').onclick=()=>el.scrollBy({left:274,behavior:'smooth'});document.getElementById('tlh').onclick=()=>go(true);
  el.onclick=e=>{const c=e.target.closest('[data-tls]');if(c)detalhe('s|'+c.dataset.tls)}}

/* 24/11: widget de vídeo — miniaturas verticais tocando sozinhas (sem som); tocar abre em tela cheia */
function renderVidW(){const el=document.getElementById('vidw');if(!el)return;
  if(PCFG&&PCFG.video_widget==='não'){el.innerHTML='';return}
  const P=(VIDS||[]).filter(v=>v.visivel!=='não'&&v.previa&&!vidDrive(v.previa));if(!P.length){el.innerHTML='';return}
  el.innerHTML=`<h2 class="tt">Vídeos</h2><div class="vw">${P.map((v,i)=>`<button type="button" class="vwc" data-vw="${i}" aria-label="${esc(v.titulo)}"><video src="${esc(v.previa)}#t=0.5" muted loop playsinline autoplay preload="metadata"></video><span>${esc(String(v.titulo||'').replace(/ · Show .*$/,''))}</span></button>`).join('')}</div>`;
  el.querySelectorAll('video').forEach(v=>{v.muted=true;v.play().catch(()=>{})});
  el.querySelector('.vw').onclick=e=>{const b=e.target.closest('[data-vw]');if(!b)return;el.querySelectorAll('video').forEach(v=>v.pause());reels(P,+b.dataset.vw);
    const volta=()=>{if(document.querySelector('.rls'))return setTimeout(volta,500);el.querySelectorAll('video').forEach(v=>v.play().catch(()=>{}))};setTimeout(volta,800)}}
/* 24/11: widget de vendas — mês atual, próximos confirmados e falta receber; tocar abre o Financeiro */
function renderWVen(){const el=document.getElementById('wven');if(!el||!D)return;const L=(SHV&&SHV.length?SHV:((D.vendas||{}).shows||[])).filter(x=>!/cancel/i.test(x.status||'')),m=HOJE.slice(0,7);
  if(!L.length){el.innerHTML='';return}
  const vm=L.filter(x=>String(x.data_venda||'').slice(0,7)===m),pr=L.filter(x=>(x.data||'')>=HOJE&&!/a confirmar/i.test(x.status||'')),fr=L.reduce((a,x)=>a+Math.max(0,(+x.valor||0)-(+x.recebido||0)),0);
  const nx=pr.sort((a,b)=>a.data<b.data?-1:1)[0];
  el.innerHTML=`<h2 class="tt">Vendas</h2><button type="button" class="wg" data-wg="fin"><div><small>Vendidos no mês</small><b>${vm.length}</b></div><div><small>Próximos shows</small><b>${pr.length}</b></div><div><small>Falta receber</small><b class="pos">${brl(fr)}</b></div>${nx?`<em>Próximo: ${ddmm(nx.data)} · ${esc(nx.cidade||nx.evento||'')}</em>`:''}</button>`}
/* 24/11: widget financeiro — saldo de agora e o mês (entra, sai, termina com); tocar abre o Financeiro */
function renderWFin(){const el=document.getElementById('wfin');if(!el||!D)return;const M=(D.meses||{})[HOJE.slice(0,7)]||{};const sd=D.saldo_real;
  if(sd==null&&M.fim==null){el.innerHTML='';return}
  el.innerHTML=`<h2 class="tt">Financeiro</h2><button type="button" class="wg" data-wg="fin"><div><small>Saldo agora</small><b class="${sd<0?'neg':''}">${sd!=null?brl(sd):'—'}</b></div><div><small>Entra no mês</small><b class="pos">${M.ent!=null?brl(M.ent):'—'}</b></div><div><small>Sai no mês</small><b class="neg">${M.sai!=null?brl(Math.abs(M.sai)):'—'}</b></div>${M.fim!=null?`<em>O mês deve terminar com ${brl(M.fim)}</em>`:''}</button>`}
['wven','wfin'].forEach(k=>document.getElementById(k).addEventListener('click',e=>{if(e.target.closest('[data-wg]')){setor('fin');scrollTo({top:0,behavior:'smooth'})}}));
function renderTudo(){renderFiltros();renderCal();renderTL();renderMetas();renderPagar();renderEquipe();urgentes();try{renderVidW()}catch(e){console.error(e)}try{renderWVen();renderWFin()}catch(e){console.error(e)}try{renderUlt()}catch(e){console.error(e)}try{renderProx()}catch(e){console.error(e)}}

/* ---------- 19/11: últimos lançamentos (extrato + app) no topo; o que é de um orçamento, borderô ou show aparece junto: pago / total ---------- */
let LNV=null,ULT=[];
const ultKey=m=>m.orc?'o:'+m.orc:m.bord?'b:'+m.bord:m.desp?'d:'+m.desp:(+m.valor>0&&m.show_data)?'s:'+m.show_data+'|'+(m.show_nome||''):'';
function ultMovs(){const ext=D.ext_ate||'',L=[];
  (D.movs||[]).forEach(m=>L.push(Object.assign({fonte:'extrato'},m)));
  (D.movs_app||[]).forEach(m=>{if(PAGS_OK&&/^pg-/.test(m.id||''))return;if(LNV&&/^ln-/.test(m.id||''))return;L.push(Object.assign({fonte:'app'},m))});
  if(PAGS_OK)PAGS.forEach(g=>LB.pgx.movs(g).forEach(o=>{if(!o.data||o.data<=ext)return;const e=g.direcao==='entrada';
    L.push({id:o.id,data:o.data,quem:g.nome,valor:(e?1:-1)*o.valor,cat:g.descricao||'Pagamento',meio:o.meio||'conta',orc:g.orc||'',obs:o.parte?'parte'+(o.obs?' · '+o.obs:''):'',fonte:'app'})}));
  if(LNV)LNV.forEach(l=>{if(l.ref||!l.data||l.data<=ext)return;L.push({id:'ln-'+l.id,data:l.data,quem:l.quem||'',valor:+l.valor||0,cat:l.cat||'Outros (a classificar)',meio:l.meio||'conta',obs:l.obs||'',orc:l.orc||'',show:l.show||'',fonte:'app'})});
  return L.filter(m=>m.data).sort((a,b)=>a.data<b.data?1:a.data>b.data?-1:0)}
function ultGrupo(k,L){const t=k[0],id=k.slice(2),its=L.filter(m=>ultKey(m)===k),soma=Math.round(its.reduce((a,m)=>a+Math.abs(+m.valor||0),0)*100)/100;
  if(t==='o'){const mt=((TAR&&TAR.metas)||[]).find(x=>String(x.id)===id);return{tipo:'Orçamento',tit:mt?mt.titulo:'Orçamento',pago:soma,total:mt?+mt.valor||0:0,its,mt}}
  if(t==='b'){const b=(D.borderos||{})[id],tt=b&&b.totais;const tot=b?(tt&&tt.gasto!=null?+tt.gasto:(b.equipe||[]).reduce((a,e)=>a+(+e.total||+e.valor||0),0)+(b.itens||[]).reduce((a,x)=>a+(+x.valor||0),0)):0;
    return{tipo:'Borderô do show',tit:b?(b.show||'Show')+' · '+ddmm(b.data):'Borderô',pago:soma,total:tot,its,b,s:b?(D.shows||[]).find(x=>x.data===b.data):null}}
  if(t==='d'){const x=(D.desp_res||{})[id];return{tipo:'Borderô de despesa',tit:x?x.titulo:'Despesa',pago:soma,total:x?x.total:0,its}}
  const[dt,nm]=id.split('|'),s=(D.shows||[]).find(x=>x.data===dt);
  return{tipo:'Cachê do show',tit:nm||(s?ddmm(s.data)+' '+s.nome:'Show'),pago:s&&s.rec!=null?Math.max(+s.rec||0,soma):soma,total:s?+s.valor||0:0,its,s,ent:true}}
function renderUlt(){const el=document.getElementById('ult');if(!el||!D)return;const L=ultMovs(),R=[],vis=new Set();
  for(const m of L){if(R.length>=15)break;const k=ultKey(m);if(k){if(vis.has(k))continue;vis.add(k);R.push({k,m,g:ultGrupo(k,L)})}else R.push({k:'',m})}
  ULT=R;if(!R.length){el.innerHTML='';return}
  const top=(document.getElementById('ul')||{}).scrollTop||0;
  el.innerHTML=`<div class="uh"><span>Últimos lançamentos</span><span class="ar"><button type="button" data-ua="-1" aria-label="Lançamentos mais novos">▲</button><button type="button" data-ua="1" aria-label="Lançamentos mais antigos">▼</button></span></div><div class="ul" id="ul">${R.map((r,i)=>{const m=r.m,v=+m.valor||0;
    if(r.g){const g=r.g,pc=g.total>0?Math.min(999,Math.round(g.pago/g.total*100)):null;
      return `<button type="button" class="ur gr" data-ui="${i}"><span class="ud">${ddmm(m.data)}</span><span class="un">${esc(g.tit)}<small>${esc(g.tipo)}</small></span><span class="up">${brl(g.pago)}${g.total?`<s> / ${brl(g.total)}</s>`:''}${pc!=null?`<small>${pc}% ${g.ent?'recebido':'pago'}</small>`:''}</span></button>`}
    return `<button type="button" class="ur" data-ui="${i}"><span class="ud">${ddmm(m.data)}</span><span class="un">${esc(m.quem||m.cat||'')}<small>${esc(m.cat||'')}</small></span><span class="uv ${v<0?'neg':'pos'}">${v>0?'+':'−'}${brl(Math.abs(v))}</span></button>`}).join('')}</div>`;
  document.getElementById('ul').scrollTop=top;fixaAbas()}
function ultAbre(r){if(!r)return;const m=r.m,g=r.g;
  if(g&&g.mt&&LB.orc){const mt=g.mt,tx='## Já pago deste orçamento\n'+g.its.map(x=>'- '+ddmm(x.data)+' '+String(x.quem||x.cat||'').replace(/:/g,' ')+': R$ '+Math.abs(+x.valor||0).toLocaleString('pt-BR',{minimumFractionDigits:2})).join('\n')+'\n- Total pago: R$ '+g.pago.toLocaleString('pt-BR',{minimumFractionDigits:2})+'\n> Pago R$ '+g.pago.toLocaleString('pt-BR',{minimumFractionDigits:2})+' de R$ '+g.total.toLocaleString('pt-BR',{minimumFractionDigits:2})+' do orçamento.\n\n';
    LB.orc.abre({id:mt.id,titulo:mt.titulo,alvo:mt.alvo,valor:mt.valor,prazo:mt.prazo,situacao:mt.situacao,texto:tx+(mt.progresso||'')});return}
  if(g){const res=`<div class="cxb"><div class="cxl"><span>${g.ent?'Recebido':'Pago'} até agora</span><b>${brl2(g.pago)}${g.total?' de '+brl2(g.total):''}</b></div>${g.total?`<div class="cxl"><span>${g.ent?'Falta receber':'Falta pagar'}</span><b>${brl2(Math.max(0,g.total-g.pago))}</b></div>`:''}</div><div class="cxl" style="justify-content:flex-start;color:var(--muted);font-size:12px">${g.its.length} ${g.its.length>1?'lançamentos':'lançamento'} somados · o último em ${ddmm(g.its[0].data)}</div>`;
    if(g.s){abre(topo(g.tipo,g.tit,'')+res+'<div style="margin-top:14px"></div>'+bordHtml(g.s).replace(/^[\s\S]*?<\/button><\/div>/,''));return}
    abre(topo(g.tipo,g.tit,'')+res);return}
  abre(topo('Lançamento · '+(m.fonte==='extrato'?'extrato':'app'),m.quem||m.cat||'',ddmm(m.data)+'/'+String(m.data).slice(0,4))+`<div class="cxb"><div class="cxl"><span>Valor</span><b class="${+m.valor<0?'neg':'pos'}">${(+m.valor>0?'+':'−')+brl2(Math.abs(+m.valor||0))}</b></div><div class="cxl"><span>Categoria</span><b>${esc(m.cat||'—')}</b></div>${m.show_nome||m.show?`<div class="cxl"><span>Show</span><b>${esc(m.show_nome||m.show)}</b></div>`:''}<div class="cxl"><span>Meio</span><b>${m.meio==='dinheiro'?'Dinheiro':'Conta'}</b></div>${m.obs?`<div class="cxl"><span>Observação</span><b style="font-weight:400">${esc(m.obs)}</b></div>`:''}</div>`)}
document.getElementById('ult').addEventListener('click',e=>{const a=e.target.closest('[data-ua]');if(a){const u=document.getElementById('ul');if(u)u.scrollBy({top:+a.dataset.ua*38,behavior:'smooth'});return}
  const b=e.target.closest('[data-ui]');if(b)ultAbre(ULT[+b.dataset.ui])});
/* 22/11: ao rolar, só as abas ficam fixas no topo (logo e últimos lançamentos rolam junto com a página) */
function fixaAbas(){const h=document.querySelector('header'),n=document.getElementById('setores');if(h&&n)h.style.top=-n.offsetTop+'px'}
addEventListener('resize',fixaAbas);addEventListener('load',fixaAbas);setTimeout(fixaAbas,0);
addEventListener('lb:mudou',()=>{try{carregar()}catch(e){}});

/* ---------- dados ao vivo ---------- */
async function carregar(){
  try{API=(await (await fetch('../config.json',{cache:'no-store'})).json()).api_url}catch(e){}
  if(!API){renderTudo();return}
  const [t,m,p,b,ln,vd,pc,sv]=await Promise.allSettled([api({acao:'tarefas'}),api({acao:'minhas_tarefas'}),api({acao:'pagamentos'}),api({acao:'borderos'}),api({acao:'lancamentos'}),api({acao:'videos'}),api({acao:'pagina_cfg'}),api({acao:'listar'})]);if(pc.status==='fulfilled'&&pc.value.ok)PCFG=pc.value.cfg||{};if(sv.status==='fulfilled'&&sv.value.ok)SHV=sv.value.shows||null;if(vd.status==='fulfilled')VIDS=vd.value.videos||[];if(ln.status==='fulfilled')LNV=ln.value.lancamentos||[];
  if(t.status==='fulfilled')TAR=t.value;if(m.status==='fulfilled')MIN=m.value;if(p.status==='fulfilled'){PAGS=p.value.pagamentos||[];PAGS_OK=true}
  if(b.status==='fulfilled'){const r=b.value;PESS=r.pessoas||[];const px={};PESS.forEach(q=>px[q.id]=q.pix);Object.entries(r.borderos||{}).forEach(([k,x])=>{if(x.tipo==='despesa'||!x.equipe)return;x.equipe.forEach(e=>{if(e.pessoa&&px[e.pessoa])e.pix=px[e.pessoa];delete e.doc});D.borderos[k]=x})}
  renderTudo()}

  try{LBCHAT.montar(document.getElementById('lbq'),{base:'../',pagina:'artista',anexo:true,atalhos:[],exemplo:'quanto falta pagar este mês?',base_dados:()=>D.ctx_ia||'',
    contexto:()=>'PÁGINA ARTISTA (Lucas): '+LBCHAT.texto(document.getElementById('main'))})}catch(e){}
