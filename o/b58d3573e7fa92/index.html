<style>
:root{--bg:#141218;--card:#1E1C24;--card2:#26232D;--line:#2E2B36;--ink:#F3F1F6;--sub:#B8B3C3;--muted:#8B8697;--pink:#CF1D51;--pinkl:#F0507E;--neg:#FF8FA8;--pos:#7FDDA9;--amber:#F2B66B}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;padding:0 0 40px}
header{border-bottom:1px solid var(--line);padding:14px 16px}header img{height:30px;display:block}
.wrap{max-width:600px;margin:0 auto;padding:18px 16px}
.ol{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pinkl)}
h1{margin:6px 0 4px;font-size:24px;font-weight:800;line-height:1.2}.os{font-size:13.5px;color:var(--sub);margin-bottom:16px}
.ok{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0 0 16px}.ok div{background:var(--card2);border-radius:12px;padding:10px 12px;border-top:3px solid var(--pink)}
.ok small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.ok b{font-size:19px;font-weight:800}
.ok .g{border-top-color:var(--pos)}.ok .g b{color:var(--pos)}.ok .t{border-top-color:var(--amber)}
.det{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.lbq{margin:0}.lbq .qt{background:none!important;padding:0!important;border-radius:0!important}
.rod{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
</style></head>
<body>
<header><img src="../../logo.png" alt="Lucas Barros"></header>
<main class="wrap" id="orc"></main>
<script src="../../lbchat.js?v=mwyxe9a1"></script>
<script>
const O = {"titulo":"Conserto do freio e tacógrafo do ônibus","alvo":"Nois Auto Freios · OS nº 2374 · 24/11/2026","valor":"1926","prazo":"Pagamento sexta, 27/11","situacao":"Previsto","progresso":"## Freio (Nois Auto Freios)\n- Peças: R$ 686,00\n- Mão de obra: R$ 600,00\n- Total do freio: R$ 1.286,00\n> Orçamento nº 2278 (R$ 2.006,88) atualizado pela OS nº 2374 de 24/11.\n\n## Motoristas\n- Gustavo (já pago): R$ 50,00\n- William: R$ 50,00\n- Flávio: R$ 100,00\n- Total motoristas: R$ 200,00\n\n## Tacógrafo\n- Taxa do governo: R$ 90,00\n- Aferição: R$ 350,00\n- Total tacógrafo: R$ 440,00\n\n## Datas\n- Segunda, 23/11: levar o ônibus no mecânico\n- Segunda a sexta: ônibus no mecânico\n- Sexta, 27/11: buscar o ônibus, pagar o conserto e levar para aferir o tacógrafo\n\n## Valor\n- Orçamento (freio + motoristas + tacógrafo): R$ 1.926,00\n- Já pago: R$ 50,00\n- Falta pagar: R$ 1.876,00","gerado":"27/11/2026 às 08:56"};
(function () {
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const brl = v => 'R$ ' + (+v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const det = String(O.progresso || '');
  const tot = (det.match(/^-\s*Orçamento[^:\n]*:\s*R\$\s?([\d.,]+)/im) || [])[1], fe = (det.match(/^-\s*Fechado[^:\n]*:\s*R\$\s?([\d.,]+)/im) || [])[1];
  try { LBCHAT.css(); } catch (e) { }
  const fm = window.LBCHAT && LBCHAT.formata;
  document.getElementById('orc').innerHTML = `<div class="ol">Orçamento</div><h1>${esc(O.titulo)}</h1>${O.alvo ? `<div class="os">${esc(O.alvo)}</div>` : ''}
    <div class="ok">${tot ? `<div><small>Orçamento</small><b>R$ ${esc(tot)}</b></div>` : ''}${fe ? `<div class="g"><small>Valor fechado</small><b>R$ ${esc(fe)}</b></div>` : ''}${O.valor ? `<div class="t"><small>Total previsto</small><b>${brl(O.valor)}</b></div>` : ''}</div>
    <div class="det lbq"><div class="qt fm">${fm ? fm(det) : `<p style="white-space:pre-line">${esc(det)}</p>`}</div></div>
    <div class="rod">${esc(O.situacao || 'Previsto')}${O.prazo ? ' · ' + esc(O.prazo) : ''}<br>Atualizado em ${esc(O.gerado)}</div>`;
})();
</script>
